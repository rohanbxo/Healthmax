name: beta

# Local development stack (SPEC.md §13 "Docker"): Postgres, Redis, the API, the
# worker and the Vite dev server. `pnpm dev` is `docker compose up`.
#
# Host ports are deliberately off the defaults (5433, 6380, 4000) so a local
# Postgres, Redis or dev server already running keeps working.
#
# Every container's `node_modules` is a named volume, at the workspace root and
# in each package. The repo is bind-mounted for hot reload, and the host's
# `node_modules` are Windows symlinks into pnpm's store — meaningless in a
# Linux container — so the volumes mask them with what the image installed.

x-dev-build: &dev-build
  context: .
  dockerfile: Dockerfile.dev

# One anchor per entry: YAML merges mappings, not sequences, so a list of
# lists would not flatten.
x-mount-apps: &mount-apps ./apps:/app/apps
x-mount-packages: &mount-packages ./packages:/app/packages
x-mount-scripts: &mount-scripts ./scripts:/app/scripts:ro
x-nm-root: &nm-root beta_node_modules:/app/node_modules
x-nm-core: &nm-core beta_core_node_modules:/app/packages/core/node_modules
x-nm-api: &nm-api beta_api_node_modules:/app/apps/api/node_modules
x-nm-web: &nm-web beta_web_node_modules:/app/apps/web/node_modules

x-api-env: &api-env
  DATABASE_URL: postgresql://beta:beta@postgres:5432/beta?schema=public
  DATABASE_URL_TEST: postgresql://beta:beta@postgres:5432/beta_test?schema=public
  REDIS_URL: redis://redis:6379
  APP_URL: http://localhost:5173
  # From the root `.env` when present, otherwise a development-only default, so
  # a clean checkout comes up without any setup.
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  DOCS_ENABLED: 'true'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Bind mounts on Windows and macOS do not deliver inotify events.
  CHOKIDAR_USEPOLLING: 'true'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beta
      POSTGRES_PASSWORD: beta
      POSTGRES_DB: beta
    ports:
      - '5433:5432'
    volumes:
      - beta_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beta -d beta']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - beta_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: compiles packages/core. `dist` is gitignored, so a clean checkout
  # has none, and both the API and the web app import the built package. The
  # bind mount means the output lands on the host too.
  core-build:
    build: *dev-build
    # `--force`: `tsc -b` trusts `tsconfig.tsbuildinfo` over the files on disk,
    # and that file is bind-mounted from the host, where it may describe a
    # `dist` that is missing or was built by a different toolchain. A few
    # seconds at startup buys a `dist` that always matches the source.
    command: pnpm --filter @beta/core exec tsc -b --force
    volumes: [*mount-apps, *mount-packages, *nm-root, *nm-core, *nm-api, *nm-web]
    restart: 'no'

  # One-shot: brings the schema up to date before the API starts.
  migrate:
    build: *dev-build
    command: pnpm --filter @beta/api exec prisma migrate deploy
    environment: *api-env
    volumes: [*mount-apps, *mount-packages, *nm-root, *nm-core, *nm-api, *nm-web]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Catches every email Floci's SES sends; read them at http://localhost:8025.
  # SMTP (1025) is only for Floci, so it stays on the compose network.
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - '8025:8025'
    # The image's own healthcheck (`/mailpit readyz`), restated so the
    # dependency below does not hinge on an upstream default.
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local AWS (S3 and SES) on one endpoint, :4566. Pinned, so an upstream
  # release cannot change the emulator's behaviour underneath us. SES relays
  # every message over SMTP to Mailpit as well as capturing it at /_aws/ses.
  floci:
    image: floci/floci:2.1.0
    restart: unless-stopped
    environment:
      FLOCI_SERVICES_SES_SMTP_HOST: mailpit
      FLOCI_SERVICES_SES_SMTP_PORT: '1025'
      FLOCI_SERVICES_SES_SMTP_STARTTLS: DISABLED
      # Off by default in Floci: without these, an unsigned or tampered GET of
      # an export succeeds despite the bucket's public access block. On, a
      # presigned link behaves as it does on real S3.
      FLOCI_AUTH_VALIDATE_SIGNATURES: 'true'
      FLOCI_SERVICES_S3_ENFORCE_AUTH: 'true'
    ports:
      - '4566:4566'
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      # The image's bundled probe: a bash /dev/tcp GET of /_floci/health. The
      # base image (ubi9-micro) has neither curl nor wget.
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot: creates the export bucket and verifies the SES sender in Floci.
  # Floci keeps no state worth keeping, so this runs on every `up` and is
  # idempotent. CI runs the same script against its own Floci container.
  aws-init:
    image: amazon/aws-cli:2.37.9
    entrypoint: ['bash', '/scripts/floci-init.sh']
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # Read natively by AWS CLI v2, so the script never names an endpoint.
      AWS_ENDPOINT_URL: http://floci:4566
      S3_EXPORT_BUCKET: beta-exports
      EMAIL_FROM: ${EMAIL_FROM:-Beta <no-reply@beta.test>}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      floci:
        condition: service_healthy
    restart: 'no'

  api:
    build: *dev-build
    command: pnpm --filter @beta/api dev
    environment:
      <<: *api-env
      NODE_ENV: development
      ROLE: api
      PORT: '3000'
    ports:
      - '4000:3000'
    volumes: [*mount-apps, *mount-packages, *nm-root, *nm-core, *nm-api, *nm-web]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      core-build:
        condition: service_completed_successfully
      aws-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build: *dev-build
    command: pnpm --filter @beta/api dev
    environment:
      <<: *api-env
      NODE_ENV: development
      ROLE: worker
    volumes: [*mount-apps, *mount-packages, *mount-scripts, *nm-root, *nm-core, *nm-api, *nm-web]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      core-build:
        condition: service_completed_successfully
      aws-init:
        condition: service_completed_successfully
    healthcheck:
      # No HTTP here, so check what the worker actually depends on.
      test: ['CMD', 'node', '/app/scripts/worker-health.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: *dev-build
    command: pnpm --filter @beta/web dev
    environment:
      # Vite proxies /api to the API container (SPEC.md §13).
      VITE_API_PROXY_TARGET: http://api:3000
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes: [*mount-apps, *mount-packages, *nm-root, *nm-core, *nm-api, *nm-web]
    depends_on:
      api:
        condition: service_healthy
      core-build:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  beta_pgdata:
  beta_redisdata:
  beta_node_modules:
  beta_core_node_modules:
  beta_api_node_modules:
  beta_web_node_modules:
