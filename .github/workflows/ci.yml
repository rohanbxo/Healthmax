name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin here: the action reads packageManager from package.json,
      # and specifying both is an error (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beta/core build
      - run: pnpm typecheck
      - run: pnpm lint

  test-core-web:
    name: Core & web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin here: the action reads packageManager from package.json,
      # and specifying both is an error (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beta/core build
      - run: pnpm --filter @beta/core test -- --coverage
      - run: pnpm --filter @beta/web test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            packages/core/coverage
            apps/web/coverage
          if-no-files-found: ignore

  test-api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beta
          POSTGRES_PASSWORD: beta
          POSTGRES_DB: beta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beta -d beta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The same local AWS emulator Compose runs, so the S3 and SES adapters
      # are tested against real AWS APIs rather than only against fakes.
      floci:
        image: floci/floci:2.1.0
        # As in Compose: check signatures, so the integration test proves a
        # tampered presigned link is refused.
        env:
          FLOCI_AUTH_VALIDATE_SIGNATURES: 'true'
          FLOCI_SERVICES_S3_ENFORCE_AUTH: 'true'
        ports:
          - 4566:4566
        # The image has neither curl nor wget; its own probe GETs
        # /_floci/health over bash's /dev/tcp.
        options: >-
          --health-cmd "/usr/local/bin/healthcheck.sh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      ROLE: api
      APP_URL: http://localhost:5173
      # The suite only ever touches DATABASE_URL_TEST. `DATABASE_URL` must be a
      # *different* database, because `scripts/prepare-test-db.mjs` refuses to
      # run when the two are equal — that guard is what stops a developer
      # migrating their dev database from the test suite. Pointing it at the
      # always-present `postgres` maintenance database keeps them distinct;
      # nothing ever connects to it here.
      DATABASE_URL: postgresql://beta:beta@localhost:5432/postgres?schema=public
      DATABASE_URL_TEST: postgresql://beta:beta@localhost:5432/beta_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      LOG_LEVEL: silent
      # Turns on `test/floci.integration.test.ts`, which is skipped everywhere
      # else so a plain `pnpm check` never needs the emulator running.
      FLOCI_TESTS: '1'
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      # Floci's dummy credentials, not secrets: the emulator accepts any pair,
      # and these are the same `test`/`test` Compose uses.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_EXPORT_BUCKET: beta-exports
      # Read by the init script (the SES identity it verifies) and by the
      # integration test (the sender it uses). The rest of the suite still
      # resolves EMAIL_PROVIDER to `none` and sends through `FakeMailer`.
      EMAIL_FROM: Beta <no-reply@beta.test>
    steps:
      - uses: actions/checkout@v4
      # No version pin here: the action reads packageManager from package.json,
      # and specifying both is an error (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beta/core build
      # The bucket and the SES sender identity have to exist before the
      # integration test runs. This is the same script, in the same AWS CLI
      # image, that Compose's `aws-init` runs, so CI also proves the script
      # works. `--network host` lets it reach the service container on
      # localhost:4566; the script has no endpoint of its own and relies on
      # the CLI honouring AWS_ENDPOINT_URL.
      - name: Create the bucket and SES identity in Floci
        run: >-
          docker run --rm --network host
          -v "$PWD/scripts:/scripts:ro"
          -e AWS_ENDPOINT_URL
          -e AWS_ACCESS_KEY_ID
          -e AWS_SECRET_ACCESS_KEY
          -e AWS_DEFAULT_REGION=us-east-1
          -e S3_EXPORT_BUCKET
          -e EMAIL_FROM
          --entrypoint bash
          amazon/aws-cli:2.37.9 /scripts/floci-init.sh
      # No explicit migrate step: `pretest:ci` runs the same preparation the
      # developer's `pnpm --filter @beta/api test` runs, so CI exercises that
      # path — including the guard above — instead of working around it.
      # No separate Floci run either: `test:ci` globs `test/**/*.test.ts`, so
      # the integration file runs here with everything else once FLOCI_TESTS=1.
      - run: pnpm --filter @beta/api test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-api
          path: apps/api/test-results/junit.xml
          if-no-files-found: warn

  docker-build:
    name: Production image
    runs-on: ubuntu-latest
    # The image is booted below, and every path except /api/health passes
    # through the Redis-backed rate limiter, so both backing services have to
    # be reachable or the check would only prove the build compiled.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beta
          POSTGRES_PASSWORD: beta
          POSTGRES_DB: beta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beta -d beta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only — nothing is pushed to a registry. The point is that the
      # multi-stage build still succeeds: it compiles core, the API and the web
      # app from a clean checkout, which catches anything that only works
      # because a local `dist/` or `node_modules` happens to be lying around.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: beta:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # `--network host` so the image reaches the service containers on the
      # runner's own ports. `ROLE=api`: the workers are covered by the API
      # suite, and this step is about what the image serves.
      - name: Boot the image and check what it serves
        run: |
          set -euo pipefail
          docker run -d --name beta-ci --network host \
            -e NODE_ENV=production \
            -e ROLE=api \
            -e PORT=3000 \
            -e APP_URL=http://localhost:3000 \
            -e 'DATABASE_URL=postgresql://beta:beta@127.0.0.1:5432/beta?schema=public' \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e JWT_SECRET=ci-only-secret-at-least-32-characters-long \
            beta:ci
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)" = 200 ]; then
              break
            fi
            sleep 2
          done
          status() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1"; }
          echo "/api/health -> $(status /api/health)"
          test "$(status /api/health)" = 200
          # The built web app is inside the image and served from the same
          # process (SPEC.md §13) — a blank page here means the build is broken.
          test "$(status /)" = 200
          test "$(status /settings)" = 200
          # A service worker answered with HTML is what broke registration once.
          curl -sI http://localhost:3000/sw.js | grep -qi 'content-type:.*javascript'
          # An unknown API path keeps the JSON envelope, never the SPA shell.
          test "$(status /api/nope)" = 404
      - name: Container logs
        if: always()
        run: docker logs beta-ci || true

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # No version pin here: the action reads packageManager from package.json,
      # and specifying both is an error (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod || true
